[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xr_media"
requires-python = ">=3.10"
dynamic = [
    "version", "description", "dependencies", "optional-dependencies",
    "scripts", "authors", "maintainers", "license",
]

[tool.uv]
package = true
